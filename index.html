<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,700&display=swap">
<style>
html,body{margin:0}

/* Layout: one full-screen sky. Words on the empty teal side; a 3D golden cage hangs in the real clouds; "let go" plays the scene. Single deliberate look. */
:root{
  --sky:#2a5866;
  --sky-deep:#1d414c;
  --cloud:#f3ebe0;
  --cloud-dim:rgba(243,235,224,.72);
  --gold:#e0b45a;
  --serif:"Crimson Pro","Iowan Old Style","Palatino Linotype",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--sky)}
body{background:var(--sky);color:var(--cloud);font-family:var(--serif);overflow-x:hidden}
.stage{position:relative;min-height:100%;min-height:100svh;overflow:hidden;display:grid;grid-template-rows:auto 1fr;
  background:var(--sky) url("assets/plate.jpg") 72% 50%/cover no-repeat}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s ease}
#scene.ready{opacity:1}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.22;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(90deg,rgba(29,65,76,.5) 0%,rgba(29,65,76,.18) 36%,rgba(29,65,76,0) 52%)}

nav{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:calc(22px + env(safe-area-inset-top,0px)) clamp(16px,5vw,64px) 0}
nav a{color:var(--cloud);text-decoration:none;font-size:1.05rem;letter-spacing:.02em}
nav a:hover{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
nav .logo{font-size:1.9rem;letter-spacing:.06em;font-weight:400}
nav .r{justify-self:end}

.copy{position:relative;z-index:2;align-self:center;padding:0 clamp(16px,5vw,64px) 8vh;pointer-events:none}
.copy .letgo{pointer-events:auto}
h1{margin:0;font-weight:600;font-size:clamp(1.75rem,3.6vw,2.9rem);line-height:1.5;max-width:15em;text-wrap:balance;text-shadow:0 1px 18px rgba(20,45,52,.35)}
h1 .line{display:block;opacity:0;transform:translateY(10px);animation:rise 1.1s cubic-bezier(.2,.7,.2,1) forwards}
h1 .line:nth-child(2){animation-delay:.25s}
h1 .line:nth-child(3){animation-delay:.5s}
h1 .line:nth-child(4){animation-delay:.75s}
@keyframes rise{to{opacity:1;transform:none}}

.letgo{font:inherit;font-weight:700;font-style:italic;color:var(--cloud);background:none;border:0;padding:0 0 2px;cursor:pointer;position:relative;white-space:nowrap}
.letgo::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:3px;background:var(--cloud);transform-origin:left;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.letgo:hover::after{transform:scaleX(.15)}
.played .letgo::after{transform:none}
.letgo:focus-visible{outline:2px solid var(--gold);outline-offset:6px;border-radius:2px}
.hand{display:inline-block;width:.85em;height:.85em;margin-left:.3em;vertical-align:-.05em;animation:tap 2.4s ease-in-out infinite 1.6s}
.played .hand{animation:none;opacity:.5}
@keyframes tap{0%,60%,100%{transform:translate(0,0)}70%{transform:translate(-3px,-3px)}80%{transform:translate(0,0)}}
.tallbr{display:none}
.hint{margin-top:28px;font-size:1rem;font-style:italic;color:var(--cloud-dim);opacity:0;animation:rise 1s ease 1.4s forwards}
.played .hint{visibility:hidden}

#about{background:var(--sky-deep);padding:clamp(64px,10vw,120px) clamp(16px,5vw,64px)}
#about .inner{max-width:38rem;display:grid;gap:18px}
#about h2{margin:0;font-weight:600;font-size:clamp(1.8rem,3vw,2.4rem)}
#about p{margin:0;font-size:1.2rem;line-height:1.65;color:var(--cloud-dim)}
#about small{font-size:.95rem;color:var(--gold);font-style:italic}

/* phones held sideways: compact quote sized to the screen height, clouds pushed to the right */
@media (min-aspect-ratio:1/1) and (max-height:560px){
  .stage{background-position:right center;background-size:auto 100%;background-color:#2b5a69}
  nav{padding-top:calc(10px + env(safe-area-inset-top,0px))}
  nav a{font-size:.9rem}
  nav .logo{font-size:1.3rem}
  .copy{padding-bottom:2vh}
  h1{font-size:clamp(1rem,5.6vh,1.6rem);line-height:1.42;max-width:none}
  .hint{margin-top:10px;font-size:.8rem}
}
@media (max-aspect-ratio:1/1){
  .stage{background-position:85% 100%;background-size:auto 62%}
  .stage{background-color:#2e5f71}
  .stage::after{display:none}
  .copy{align-self:start;padding-top:11vh}
  h1{font-size:clamp(1.15rem,5.2vw,1.45rem);line-height:1.45;max-width:17em}
  .tallbr{display:inline}
  .hint{margin-top:14px;font-size:.88rem}
  nav{padding-top:calc(16px + env(safe-area-inset-top,0px))}
  nav a{font-size:.95rem}
  nav .logo{font-size:1.45rem}
}
@media (prefers-reduced-motion:reduce){
  h1 .line,.hint{animation:none;opacity:1;transform:none}
  .hand{animation:none}
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <canvas id="scene" aria-label="A man in a green plaid shirt stands in an old bronze birdcage hanging in the sky. When you let go, he crouches through the door, holds the bars from outside, leans back and lets go, falling backwards slowly through the clouds."></canvas>
  <nav>
    <a href="#top">home</a>
    <a class="logo" href="#top" aria-label="GL, home">GL</a>
    <a class="r" href="#about">about</a>
  </nav>
  <div class="copy" id="top">
    <h1>
      <span class="line">Sometimes you have<br class="tallbr"> to <button class="letgo" id="letgo" type="button" aria-label="let go (plays the animation)">let go</button><svg class="hand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10"/><path d="M12 9.5a1.5 1.5 0 0 1 3 0V11"/><path d="M15 10.5a1.5 1.5 0 0 1 3 0v3.5a6 6 0 0 1-6 6h-1.2a5 5 0 0 1-3.9-1.9L4.6 15a1.5 1.5 0 0 1 2.3-1.9L9 15"/><path d="M4 4l1.5 1.5M9.5 1.5V2.5M14.5 3.5l-1 1"/></svg></span>
      <span class="line">of the life you planned</span>
      <span class="line">to find the life</span>
      <span class="line">that's waiting for you</span>
    </h1>
    <p class="hint">Tap "let go".</p>
  </div>
</div>

<section id="about">
  <div class="inner">
    <h2>about</h2>
    <p>This is where your story goes: who you are, what you left behind, and what you're building now.</p>
    <small>Quote often attributed to Joseph Campbell.</small>
  </div>
</section>

<script type="module">
import * as THREE from "three";

/* ---------- constants (units = pixels of the 1280x720 cloud plate) ---------- */
const PW=1280, PH=720;
const ANCHOR={x:1007,y:148};          // where the cage base sits on the plate
const CAGE_SCALE_WIDE=.34, CAGE_SCALE_TALL=.62;   // smaller on wide screens, bigger on phones
const PIVOT=3600;                    // chain pivot height above the cage base
const R=84, STRAIGHT=150, DOME=74, NB=36, S=2*Math.PI/NB, MID=30;
const DOOR=1.2;                      // door faces right, turned a little toward the camera
const DOOR_TOP=147, FLOOR=8;   // the door opening reaches the top ring
const FIG_S=1.12;               // the man, 12% bigger
let T_RELEASE=0;   // set from the fall simulation below

const canvas=document.getElementById("scene"), stageEl=document.getElementById("stage");

renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
renderer.outputColorSpace=THREE.SRGBColorSpace;

renderer.toneMappingExposure=1.0;

renderer.shadowMap.enabled=true;

/* ---------- background: the real clouds, drawn with "cover" fit ---------- */
const bgScene=new THREE.Scene(), bgCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const bgUni={tex:{value:null},rect:{value:new THREE.Vector4(0,0,1,1)},res:{value:new THREE.Vector2(1,1)}};

function canvasTex(w,h,draw,repeat=[1,1],srgb=true){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);

const bronze=new THREE.MeshPhysicalMaterial({color:0x6e7477,metalness:.85,roughness:.62,roughnessMap:tarnishRough,envMapIntensity:.85,clearcoat:.2,clearcoatRoughness:.3});

const jeans=new THREE.MeshStandardMaterial({map:denim,roughness:.92,metalness:0,bumpMap:folds,bumpScale:1.2});
const neckM=new THREE.MeshStandardMaterial({color:0x9a6a55,roughness:.75});
const skin=new THREE.MeshPhysicalMaterial({color:0xa9785f,roughness:.62,sheen:.35,sheenColor:new THREE.Color(0xffc0a0),envMapIntensity:.5});
const hairM=new THREE.MeshStandardMaterial({color:0x2a1d16,roughness:.85});
const beardM=new THREE.MeshStandardMaterial({color:0x3b2a20,roughness:.95,transparent:true,opacity:.85});
const shoeM=new THREE.MeshStandardMaterial({color:0x37373a,roughness:.75,metalness:0,bumpMap:folds,bumpScale:.6});   // dark canvas sneakers
const soleM=new THREE.MeshStandardMaterial({color:0xd6d1c6,roughness:.8});   // white rubber soles
const beltM=new THREE.MeshStandardMaterial({color:0x3a2a1e,roughness:.55});

/* ---------- 3D scene ---------- */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(18,1,1,20000);
const stage=new THREE.Group(); scene.add(stage);      // scaled so 1 unit = 1 plate px
const hang=new THREE.Group(); hang.position.y=PIVOT; stage.add(hang);
const cage=new THREE.Group(); cage.position.y=-PIVOT; hang.add(cage);

scene.add(new THREE.HemisphereLight(0x86aab6,0xe6c3a2,.9));
scene.fog=new THREE.Fog(0x6b8f99,0,3000/0.11);   // ~20% haze toward the sky colour, like the clouds
const sun=new THREE.DirectionalLight(0xffe2c6,2.6); scene.add(sun); scene.add(sun.target);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.bias=-0.0004;
const SUN_DIR=new THREE.Vector3(-0.75,1.05,1.15).normalize();
const rim=new THREE.DirectionalLight(0xffd8b4,1.4); rim.position.set(1.1,.35,-1); scene.add(rim);   // warm back light off the clouds
const bounce=new THREE.DirectionalLight(0xf0c8a6,.7); bounce.position.set(.3,-1,.6); scene.add(bounce);   // light reflected up from the clouds below

const add=(parent,m,cast=true,recv=true)=>{m.castShadow=cast;m.receiveShadow=recv;parent.add(m);return m;};
const P=(a,y,r=R)=>new THREE.Vector3(r*Math.sin(a),y,r*Math.cos(a));
const THICK=.62;   // thin bars and rings, like the reference

function ring(y,r,rad,mat){const m=new THREE.Mesh(new THREE.TorusGeometry(r,rad*THICK,14,128),mat);m.rotation.x=Math.PI/2;m.position.y=y;m.castShadow=m.receiveShadow=true;return m;}
const BAR=2.1;

/* cage: base, bars, dome, rings */
const HATCH=27;   // round opening in the floor where the ladder comes up
add(cage,new THREE.Mesh(new THREE.CylinderGeometry(R+8,R+4,FLOOR+14,96,1,true),brass)).position.y=(FLOOR-14)/2;
add(cage,new THREE.Mesh(new THREE.CylinderGeometry(R+4,R-6,6,96,1,true),brass)).position.y=-17;
{const top=new THREE.Mesh(new THREE.RingGeometry(HATCH,R+8,96,1),brass);top.rotation.x=-Math.PI/2;top.position.y=FLOOR;add(cage,top);
 const bot=new THREE.Mesh(new THREE.RingGeometry(HATCH,R-6,96,1),brass);bot.rotation.x=Math.PI/2;bot.position.y=-20;add(cage,bot);
 const wallM=brass.clone();wallM.side=THREE.BackSide;
 const wall=new THREE.Mesh(new THREE.CylinderGeometry(HATCH,HATCH,FLOOR+20,48,1,true),wallM);wall.position.y=(FLOOR-20)/2;add(cage,wall);}
cage.add(ring(-14,R+5,3.4/THICK,brass)); cage.add(ring(-4,R+7,1.8/THICK,brass)); cage.add(ring(FLOOR,R+8,2.6/THICK,brass));
const off=DOOR-1.5*S, doorIdx=[];
for(let i=0;i<NB;i++){const a=off+i*S;const d=Math.atan2(Math.sin(a-DOOR),Math.cos(a-DOOR));
  const inDoor=Math.abs(d)<2*S-1e-3; if(inDoor)doorIdx.push(a);
  cage.add(tube([P(a,inDoor?DOOR_TOP:FLOOR),P(a,STRAIGHT)],BAR,bronze,2));
  const dome=[];for(let k=0;k<=12;k++){const t=k/12*Math.PI/2;dome.push(P(a,STRAIGHT+DOME*Math.sin(t),R*Math.cos(t)));}
  cage.add(tube(dome,BAR,bronze,24));}
cage.add(ring(STRAIGHT,R,3.0,bronze));
cage.add(ring(STRAIGHT+DOME*Math.sin(.75),R*Math.cos(.75),2.2,bronze));
const hingeA=DOOR-2*S, freeA=DOOR+2*S;
cage.add(tube(arc(freeA,hingeA+2*Math.PI,MID),2.6,bronze));
cage.add(tube(arc(hingeA,freeA,DOOR_TOP+2),2.2,bronze));
add(cage,new THREE.Mesh(new THREE.ConeGeometry(5,9,20),bronze)).position.y=STRAIGHT+DOME+3;
add(cage,new THREE.Mesh(new THREE.TorusGeometry(14,1.6,12,48),bronze)).position.y=STRAIGHT+DOME+22;
{const linkG=new THREE.TorusGeometry(3.2,.85,8,20);linkG.scale(1,1.6,1);
 const y0=STRAIGHT+DOME+38, n=Math.ceil((PIVOT-y0)/8.6)+2;
 const links=new THREE.InstancedMesh(linkG,bronze,n),m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler();
 for(let i=0;i<n;i++){e.set(0,i%2?Math.PI/2:0,0);q.setFromEuler(e);m.compose(new THREE.Vector3(0,y0+i*8.6,0),q,new THREE.Vector3(1,1,1));links.setMatrixAt(i,m);}
 cage.add(links);}
/* door on a hinge */
const hingeP=P(hingeA,0);
const door=new THREE.Group(); door.position.copy(hingeP); cage.add(door);
for(const a of doorIdx){const p=P(a,0).sub(hingeP);door.add(tube([new THREE.Vector3(p.x,FLOOR+2,p.z),new THREE.Vector3(p.x,DOOR_TOP,p.z)],BAR,bronze,2));}
for(const y of [FLOOR+3,MID,DOOR_TOP-2]) door.add(tube(arc(hingeA,freeA,y).map(v=>v.sub(hingeP)),y===MID?2.6:2.2,bronze));
const openSign=(()=>{const t=new THREE.Vector3().subVectors(P(freeA,0),hingeP);const r=v=>Math.hypot(v.x+hingeP.x,v.z+hingeP.z);
  return r(t.clone().applyAxisAngle(new THREE.Vector3(0,1,0),.2))>r(t)?1:-1;})();
/* ladder: thin dark iron, like the original */
{const len=4200, topY=FLOOR+60;
 for(const x of[-17,17]){const rail=new THREE.Mesh(new THREE.CylinderGeometry(2.1,2.1,len+topY,8),iron);rail.position.set(x,(topY-len)/2,0);rail.castShadow=true;cage.add(rail);
   const cap=new THREE.Mesh(new THREE.SphereGeometry(2.6,12,8),iron);cap.position.set(x,topY,0);cage.add(cap);}
 const n=Math.floor(len/26)+3,rung=new THREE.CylinderGeometry(1.6,1.6,34,6);rung.rotateZ(Math.PI/2);

const RUNG=26, HANDLE_TOP=FLOOR+2*RUNG;           // rungs every 26 units, two above the floor as handles

  const k=Math.max(bw/PW,bh/PH), w=PW*k, h=PH*k, x0=bx+(bw-w)*px, y0=by+(bh-h)*py;
  const dpr=Math.min(devicePixelRatio||1,2,Math.max(1,1.7/k));
  renderer.setPixelRatio(dpr); renderer.setSize(W,H,false); bgUni.res.value.set(W*dpr,H*dpr);
  bgUni.rect.value.set(x0*dpr,y0*dpr,w*dpr,h*dpr);
  camera.aspect=W/H; const D=3000; camera.position.set(0,0,D); camera.updateProjectionMatrix();
  const Hw=2*D*Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  unit=k*Hw/H*(portrait?CAGE_SCALE_TALL:CAGE_SCALE_WIDE);
  const shortWide=!portrait&&H<560;
  const sx=portrait?W*.65:x0+ANCHOR.x*k, sy=y0+(ANCHOR.y+(portrait?60:shortWide?95:0))*k;   // phones: hang the cage lower, clear of the text and menu
  stage.position.set((sx/W-.5)*Hw*W/H,(.5-sy/H)*Hw,0);
  stage.scale.setScalar(unit);
  if(!climbSet){const depth=(stage.position.y+Hw/2)/unit;climbStart=-Math.min(1000,depth+40);climbSet=true;}
  // sun shadows cover the cage
  const c=stage.position.clone().add(new THREE.Vector3(0,110*unit,0));
  sun.target.position.copy(c); sun.position.copy(c).addScaledVector(SUN_DIR,900*unit);
  const sc=sun.shadow.camera, e=190*unit; sc.left=-e;sc.right=e;sc.top=e;sc.bottom=-e;sc.near=1;sc.far=2000*unit;sc.updateProjectionMatrix();
  sun.shadow.normalBias=.4*unit;
}

/* ---------- timeline ---------- */
let t0=null, released=false, relTilt={x:0,z:0}, lastNow=null;
function massOffset(){            // his weight pulls the cage a little toward where he stands and leans
  const r=Math.hypot(fig.position.x,fig.position.z)+1e-6, ext=r+55*Math.max(0,Math.sin(-leanNow));
  const k=8e-6; return {x:k*fig.position.z/r*ext, z:-k*fig.position.x/r*ext};}
function swayAt(t,clock){
  // a slow pendulum swing from side to side, gentler once he starts moving
  const calm=t===null?1:mix(1,.45,smooth(t/3));
  let rx=calm*.0018*Math.sin(clock*.95*.5+1.2), rz=calm*.0062*Math.sin(clock*.95);
  if(t===null) return {rx,rz};
  if(t<T_RELEASE){const o=massOffset(); return {rx:rx+o.x, rz:rz+o.z};}
  const u=t-T_RELEASE, d=Math.exp(-.45*u)*(Math.cos(1.1*u)+.41*Math.sin(1.1*u));   // his weight is gone: the cage swings back
  return {rx:rx+relTilt.x*d, rz:rz+relTilt.z*d};
}
let mode=reduce?"main":"intro", introStart=null, fallStart=null, pendingMain=false, introState=null;
function frame(now){
  const clock=now/1000;
  if(introStart===null)introStart=now;
  if(mode==="intro"){
    const ti=(now-introStart)/1000;
    door.rotation.y=0;
    if(fig.parent!==cage)cage.add(fig);
    const s=swayAt(null,clock); hang.rotation.set(s.rx,0,s.rz); stage.updateMatrixWorld(true);
    introState=poseIntro(ti,clock);
    shadow.visible=fig.position.y>FLOOR-3&&Math.hypot(fig.position.x,fig.position.z)>HATCH+4;
    shadow.position.x=fig.position.x; shadow.position.z=fig.position.z;
    if(introState.seated){mode="main"; t0=pendingMain?now:null; pendingMain=false;}
    return finishFrame(now);
  }
  if(mode==="ladderFall"){
    const s=swayAt(null,clock); hang.rotation.set(s.rx,0,s.rz);
    poseFalling((now-fallStart)/1000); shadow.visible=false;
    return finishFrame(now);
  }
  const t=t0===null?null:(now-t0)/1000, tt=t===null?-1:t;
  door.rotation.y=openSign*doorAngleAt(t);
  if(tt<T_RELEASE){
    if(released){cage.add(fig);released=false;}
    const s=swayAt(t,clock); hang.rotation.set(s.rx,0,s.rz); stage.updateMatrixWorld(true);
    const b=poseOnCage(tt,clock);
    const r=Math.hypot(fig.position.x,fig.position.z);
    shadow.visible=r<R-6; shadow.position.x=fig.position.x; shadow.position.z=fig.position.z; shadow.rotation.z=-b.yaw;
  } else {
    if(!released){captureRelease(clock); released=true;}
    const s=swayAt(t,clock); hang.rotation.set(s.rx,0,s.rz);
    poseFalling(t-T_RELEASE); shadow.visible=false;
  }
  finishFrame(now);
}
function finishFrame(now){
  const dt=lastNow===null?0:(now-lastNow)/1000; lastNow=now;
  if(!window.__manual) smoothPose(dt);
  renderer.clear(); renderer.render(bgScene,bgCam); renderer.render(scene,camera);
}

/* ---------- boot ---------- */
new THREE.TextureLoader().load("assets/plate.jpg",tex=>{
  tex.colorSpace=THREE.NoColorSpace; tex.minFilter=THREE.LinearFilter; tex.generateMipmaps=false; bgUni.tex.value=tex;
  const env=tex.clone(); env.colorSpace=THREE.SRGBColorSpace; env.mapping=THREE.EquirectangularReflectionMapping; env.needsUpdate=true;
  const pm=new THREE.PMREMGenerator(renderer); scene.environment=pm.fromEquirectangular(env).texture; pm.dispose();
  layout(); canvas.classList.add("ready");
  const loop=n=>{frame(n);requestAnimationFrame(loop)};
  if(!window.__manual) requestAnimationFrame(loop);
  window.__seek=(t,clock=10)=>{const now=clock*1000; mode="main"; t0=t===null?null:now-t*1000; frame(now);};
  window.__seekIntro=(ti,clock=10)=>{const now=clock*1000; mode="intro"; introStart=now-ti*1000; frame(now);};
  window.__ladderFall=(ti,u)=>{window.__seekIntro(ti); captureLadderFall(ti,10); mode="ladderFall"; fallStart=10000-u*1000; frame(10000);};
  window.__dbg={camera,head,fig,renderer,layout,frame,scene,bgScene,bgCam,cage,door};
  window.__ready=true;
});
new ResizeObserver(()=>layout()).observe(stageEl);

document.getElementById("letgo").addEventListener("click",()=>{
  stageEl.classList.add("played");
  const now=performance.now();
  if(mode==="intro"){
    if(introState&&introState.onLadder){captureLadderFall((now-introStart)/1000,now/1000); mode="ladderFall"; fallStart=now;}   // lets go of the ladder
    else pendingMain=true;                                // already inside: sits down, then starts
    return;}
  const busy=mode==="main"&&t0!==null&&(now-t0)/1000<T_RELEASE+7;
  if(busy)return;
  if(mode==="ladderFall"||(mode==="main"&&t0!==null)){    // after a fall: start again from the climb
    mode="intro"; introStart=now; cage.add(fig); rel=null; armCap=null; released=false; t0=null; pendingMain=false; smoothState=null; return;}
  t0=reduce?now-30000:now; released=false; cage.add(fig); armCap=null; rel=null; smoothState=null;
});
</script>
